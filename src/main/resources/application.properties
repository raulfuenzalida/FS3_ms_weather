# Configuración del Servidor
server.port=8081

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/weather_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración del Cron Job (configurable)
weather.cron.expression=0 30 9 * * *

# Configuración de Logging
logging.level.duoc.fs3.ms_weather=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configuración de Conexión HTTP
spring.http.timeout.connect=5000
spring.http.timeout.read=10000

# Configuración de API Externa
weather.api.url=https://api.boostr.cl/weather.json
weather.api.timeout.connect=5000
weather.api.timeout.read=10000
weather.api.retry.attempts=3

# Configuración de Procesamiento de Datos
weather.batch.size=50
weather.processing.parallel=true

# Configuración de Base de Datos
weather.db.schema=weather_db
weather.db.table=weather_data
